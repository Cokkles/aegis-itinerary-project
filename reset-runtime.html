<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS Runtime Reset</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131b;color:#e9f5fb;font:16px system-ui,sans-serif}.card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #2c5366;border-radius:18px;background:#091a24}.muted{color:#9cb5c2}pre{white-space:pre-wrap;color:#8fdcff}</style>
</head>
<body><div class="card"><h1>AEGIS Runtime Reset</h1><p class="muted">Removing stale PWA runtime caches. Your AEGIS local/session data is not being cleared.</p><pre id="status">Starting…</pre></div>
<script>
(async()=>{
 const out=document.getElementById('status');
 const log=s=>out.textContent+='\n'+s;
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     for(const reg of regs){await reg.unregister();}
     log('✓ Service workers unregistered: '+regs.length);
   }
   if('caches' in window){
     const keys=await caches.keys();
     const aegis=keys.filter(k=>/^aegis-/i.test(k));
     for(const key of aegis){await caches.delete(key);}
     log('✓ AEGIS caches cleared: '+aegis.length);
   }
   log('✓ Preserved localStorage and sessionStorage');
   log('Reloading current AEGIS runtime…');
   setTimeout(()=>location.replace('./?runtime_reset=2.6.3e&ts='+Date.now()),900);
 }catch(err){
   log('Reset failed: '+(err&&err.message||err));
   log('Use browser site-data controls to clear Service Workers and Cache Storage manually.');
 }
})();
</script></body></html>
